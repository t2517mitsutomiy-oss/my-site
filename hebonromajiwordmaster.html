<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ヘボン式 ローマ字単語マスター（双方向・タイマー調整）</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #fef3c7 50%, #fbcfe8 100%);
            min-height: 100vh;
            user-select: none;
        }

        .slide-card {
            display: none;
            opacity: 0;
            transform: scale(0.96);
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        .slide-card.active {
            display: flex;
            opacity: 1;
            transform: scale(1);
        }

        /* Key cap style for lowercase */
        .key-cap {
            background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
            border: 2px solid #94a3b8;
            border-bottom-width: 6px;
            border-radius: 12px;
            box-shadow: 0 6px 0 #64748b, 0 8px 14px rgba(0, 0, 0, 0.12);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #1e293b;
            text-shadow: 0 1px 0 rgba(255,255,255,0.8);
            transition: all 0.15s ease;
            font-family: 'M PLUS Rounded 1c', sans-serif;
        }

        .key-cap.vowel {
            background: linear-gradient(180deg, #fef08a 0%, #fde047 100%);
            border-color: #ca8a04;
            box-shadow: 0 6px 0 #a16207, 0 8px 14px rgba(234, 179, 8, 0.25);
            color: #713f12;
        }

        .key-cap.consonant {
            background: linear-gradient(180deg, #bfdbfe 0%, #93c5fd 100%);
            border-color: #2563eb;
            box-shadow: 0 6px 0 #1d4ed8, 0 8px 14px rgba(59, 130, 246, 0.25);
            color: #1e3a8a;
        }

        /* Pop in animation */
        @keyframes popIn {
            0% { transform: scale(0.4) rotate(-5deg); opacity: 0; }
            70% { transform: scale(1.1) rotate(2deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .pop-in {
            animation: popIn 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Pulse glow animation */
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.6); }
            50% { box-shadow: 0 0 0 12px rgba(34, 197, 94, 0); }
        }

        .pulse-btn {
            animation: pulseGlow 2s infinite;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between p-3 sm:p-6 min-h-screen">

    <!-- Navigation & Settings Header -->
    <header class="w-full max-w-5xl bg-white/95 backdrop-blur-md rounded-2xl p-4 shadow-lg border-2 border-white flex flex-col gap-3 mb-3">
        <div class="flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-xl bg-indigo-600 text-white flex items-center justify-center text-2xl shadow-md">
                    <i class="fa-solid fa-spell-check"></i>
                </div>
                <div>
                    <h1 class="text-lg sm:text-xl font-black text-slate-800 leading-tight flex items-center gap-2">
                        ヘボン式 ローマ字単語マスター
                    </h1>
                    <p class="text-xs text-slate-500 font-bold">じどうで「もんだい ➔ こたえ」が切り替わるよ！</p>
                </div>
            </div>

            <!-- Settings Controls: Speed & Mode -->
            <div class="flex flex-wrap items-center gap-2 sm:gap-3 bg-slate-100 p-2 rounded-2xl border border-slate-200">
                <!-- Conversion Direction Selector -->
                <div class="flex items-center gap-1 bg-white px-2.5 py-1.5 rounded-xl border border-slate-300 shadow-sm text-xs font-black text-slate-700">
                    <i class="fa-solid fa-arrow-right-arrow-left text-indigo-500"></i>
                    <select id="modeSelect" onchange="changeMode(this.value)" class="bg-transparent focus:outline-none font-bold text-slate-800 cursor-pointer">
                        <option value="hiraToRoma">ひらがな ➔ ローマ字</option>
                        <option value="romaToHira">ローマ字 ➔ ひらがな</option>
                    </select>
                </div>

                <!-- Speed Selector (1s to 5s) -->
                <div class="flex items-center gap-1 bg-white px-2.5 py-1.5 rounded-xl border border-slate-300 shadow-sm text-xs font-black text-slate-700">
                    <i class="fa-solid fa-clock text-amber-500"></i>
                    <span>タイマー:</span>
                    <select id="speedSelect" onchange="changeSpeed(this.value)" class="bg-transparent focus:outline-none font-bold text-indigo-600 cursor-pointer">
                        <option value="1000">1秒</option>
                        <option value="2000">2秒</option>
                        <option value="3000" selected>3秒</option>
                        <option value="4000">4秒</option>
                        <option value="5000">5秒</option>
                    </select>
                </div>
            </div>

            <!-- Playback Controls -->
            <div class="flex items-center gap-2 sm:gap-3 bg-slate-100 p-1.5 rounded-xl border border-slate-200">
                <button id="btnPrev" onclick="prevSlide()" class="w-10 h-10 rounded-lg bg-white text-slate-700 hover:bg-slate-200 flex items-center justify-center font-bold shadow-sm transition active:scale-95" title="まえへ">
                    <i class="fa-solid fa-chevron-left text-lg"></i>
                </button>
                <button id="btnPlayPause" onclick="togglePlayPause()" class="px-4 h-10 rounded-lg bg-emerald-500 text-white font-black flex items-center gap-2 shadow-md hover:bg-emerald-600 transition pulse-btn active:scale-95">
                    <i id="playIcon" class="fa-solid fa-pause"></i>
                    <span id="playText" class="text-sm">一時停止</span>
                </button>
                <button id="btnNext" onclick="nextSlide()" class="w-10 h-10 rounded-lg bg-white text-slate-700 hover:bg-slate-200 flex items-center justify-center font-bold shadow-sm transition active:scale-95" title="つぎへ">
                    <i class="fa-solid fa-chevron-right text-lg"></i>
                </button>
                <button onclick="resetSlides()" class="w-10 h-10 rounded-lg bg-amber-100 text-amber-700 hover:bg-amber-200 flex items-center justify-center font-bold transition active:scale-95" title="さいしょから">
                    <i class="fa-solid fa-rotate-left"></i>
                </button>
                <button onclick="toggleGridModal()" class="px-3 h-10 rounded-lg bg-indigo-100 text-indigo-700 hover:bg-indigo-200 font-bold text-xs sm:text-sm flex items-center gap-1.5 transition active:scale-95" title="一覧">
                    <i class="fa-solid fa-th-large"></i>
                    <span class="hidden sm:inline">一覧</span>
                </button>
            </div>

            <!-- Slide Counter -->
            <div class="flex items-center gap-2 bg-indigo-50 px-3 py-1.5 rounded-xl border border-indigo-100">
                <span class="text-xs font-bold text-indigo-400">スライド</span>
                <span id="slideCounter" class="text-base font-black text-indigo-600">1 / 1</span>
            </div>
        </div>

        <!-- Category Filters -->
        <div class="flex items-center gap-1.5 overflow-x-auto pb-1 text-xs font-bold scrollbar-none">
            <span class="text-slate-400 shrink-0 mr-1"><i class="fa-solid fa-filter"></i> ジャンル:</span>
            <button onclick="filterCategory('all')" id="cat-all" class="cat-btn bg-indigo-600 text-white px-3 py-1.5 rounded-lg shadow-sm transition shrink-0">すべて</button>
            <button onclick="filterCategory('food')" id="cat-food" class="cat-btn bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg transition shrink-0">たべもの・いきもの</button>
            <button onclick="filterCategory('town')" id="cat-town" class="cat-btn bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg transition shrink-0">のりもの・まち</button>
            <button onclick="filterCategory('life')" id="cat-life" class="cat-btn bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg transition shrink-0">がっこう・かぞく</button>
            <button onclick="filterCategory('hepburn_special')" id="cat-hepburn_special" class="cat-btn bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg transition shrink-0">ヘボン式とくしゅう (sh, ch, ts, f, j)</button>
            <button onclick="filterCategory('rules')" id="cat-rules" class="cat-btn bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg transition shrink-0">長音バー(ā ī ū ē ō)・っ・んルール</button>
        </div>
    </header>

    <!-- Timer Progress Gauge Container -->
    <div class="w-full max-w-5xl bg-slate-200/80 rounded-full h-3.5 mb-3 overflow-hidden border border-white shadow-inner relative flex items-center">
        <div id="timerBar" class="bg-gradient-to-r from-emerald-400 via-teal-500 to-indigo-500 h-full w-0 transition-all duration-100 ease-linear"></div>
    </div>

    <!-- Main Presentation Canvas Container -->
    <main id="slideContainer" class="w-full max-w-5xl flex-1 flex items-center justify-center relative my-auto min-h-[440px]">
        <!-- Dynamic Slide Cards generated by JS -->
    </main>

    <!-- Slide Navigation Grid Modal -->
    <div id="gridModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="bg-white w-full max-w-3xl max-h-[85vh] rounded-3xl p-6 flex flex-col shadow-2xl border-4 border-indigo-200">
            <div class="flex items-center justify-between pb-4 border-b border-slate-200 mb-4">
                <h2 class="text-xl font-black text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-th-large text-indigo-500"></i> ヘボン式 単語いちらん
                </h2>
                <button onclick="toggleGridModal()" class="w-10 h-10 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center font-bold text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="gridItemsList" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 overflow-y-auto p-1 flex-1">
                <!-- Grid items generated by JS -->
            </div>
        </div>
    </div>

    <!-- Footer Help -->
    <footer class="w-full max-w-5xl text-center mt-3 text-slate-500 text-xs font-bold flex flex-wrap justify-between items-center gap-2 px-2">
        <div>
            <i class="fa-solid fa-keyboard mr-1"></i> <kbd class="bg-white px-2 py-0.5 rounded shadow-sm border border-slate-300">←</kbd> <kbd class="bg-white px-2 py-0.5 rounded shadow-sm border border-slate-300">→</kbd> キーで 手どう操作
        </div>
        <div>
            <i class="fa-regular fa-clock mr-1"></i> タイマー選択: <span id="currentSpeedText" class="font-extrabold text-indigo-600">3秒</span> 間隔
        </div>
        <div>
            <kbd class="bg-white px-2 py-0.5 rounded shadow-sm border border-slate-300">Space</kbd> キーで 一時停止 / さいせい
        </div>
    </footer>

    <script>
        // Comprehensive Dataset of 100 Words for Hepburn Romaji Practice (with Macrons ā, ī, ū, ē, ō)
        const RAW_WORDS_DATA = [

            { category: 'town', word: 'としょかん', icon: '📚', hepburn: 'toshokan', keys: ['t','o','s','h','o','k','a','n'], note: '「しょ」は syo ではなく【sho】と書くのがヘボン式！' },

            // --- 3. がっこう・かぞく (20語) ---
            { category: 'life', word: 'がっこう', icon: '🏫', hepburn: 'gakkō', keys: ['g','a','k','k','ō'], note: '「っ」は k を2回重ねて【kk】！「こう」の長音は【ō】！' },
            { category: 'life', word: 'きょうしつ', icon: '🏫', hepburn: 'kyōshitsu', keys: ['k','y','ō','s','h','i','t','s','u'], note: '「きょう」は【kyō】、「し」は【shi】、「つ」は【tsu】！' },
            { category: 'life', word: 'ノート', icon: '📓', hepburn: 'nōto', keys: ['n','ō','t','o'], note: '「のー」の長音は o の上にバーをつけて【nōto】！' },

                itemBtn.innerHTML = `
                    <div class="flex items-center justify-between w-full mb-1">
                        <span class="text-[10px] font-bold px-1.5 py-0.5 rounded ${isQuestion ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'}">
                            ${isQuestion ? '問' : '答'}
                        </span>
                        <span class="text-[10px] text-slate-400 font-bold">#${idx + 1}</span>
                    </div>
                    <div class="text-center my-1 flex items-center justify-center gap-1">
                        <span class="text-sm">${slide.icon}</span>
                        <span class="text-sm font-black ${isQuestion ? 'text-indigo-700' : 'text-emerald-600'}">
                            ${titleText}
                        </span>
                    </div>
                `;
                gridItemsList.appendChild(itemBtn);
            });
        }

        function showSlide(index) {
            if (activeSlides.length === 0) return;

            const currentCard = document.getElementById(`slide-${currentSlideIndex}`);
            if (currentCard) {
                currentCard.classList.remove('active');
            }

            currentSlideIndex = (index + activeSlides.length) % activeSlides.length;

            const newCard = document.getElementById(`slide-${currentSlideIndex}`);
            if (newCard) {
                newCard.classList.add('active');
            }

            slideCounter.textContent = `${currentSlideIndex + 1} / ${activeSlides.length}`;
            slideStartTime = performance.now();
        }

        function timerStep(now) {
            if (!isPlaying) return;

            if (!slideStartTime) slideStartTime = now;
            const elapsed = now - slideStartTime;
            const progress = Math.min(elapsed / DURATION_PER_SLIDE, 1);

            timerBar.style.width = `${progress * 100}%`;

            if (elapsed >= DURATION_PER_SLIDE) {
                showSlide(currentSlideIndex + 1);
            }

            animationFrameId = requestAnimationFrame(timerStep);
        }

        function startTimer() {
            if (!isPlaying) return;
            slideStartTime = performance.now();
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            animationFrameId = requestAnimationFrame(timerStep);
        }

        function stopTimer() {
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
        }

        function togglePlayPause() {
            isPlaying = !isPlaying;
            if (isPlaying) {
                playIcon.className = "fa-solid fa-pause";
                playText.textContent = "一時停止";
                btnPlayPause.classList.add("pulse-btn");
                btnPlayPause.classList.replace("bg-amber-500", "bg-emerald-500");
                startTimer();
            } else {
                playIcon.className = "fa-solid fa-play";
                playText.textContent = "さいせい";
                btnPlayPause.classList.remove("pulse-btn");
                btnPlayPause.classList.replace("bg-emerald-500", "bg-amber-500");
                stopTimer();
            }
        }

        function nextSlide() {
            showSlide(currentSlideIndex + 1);
            if (isPlaying) startTimer();
        }

        function prevSlide() {
            showSlide(currentSlideIndex - 1);
            if (isPlaying) startTimer();
        }

        function resetSlides() {
            showSlide(0);
            if (isPlaying) startTimer();
        }

        function changeSpeed(val) {
            DURATION_PER_SLIDE = parseInt(val, 10);
            const sec = DURATION_PER_SLIDE / 1000;
            currentSpeedText.textContent = `${sec}秒`;
            renderSlides();
            showSlide(currentSlideIndex);
            if (isPlaying) startTimer();
        }

        function changeMode(val) {
            currentMode = val;
            activeSlides = buildSlidesData(currentCategory, currentMode);
            currentSlideIndex = 0;
            renderSlides();
            showSlide(0);
            if (isPlaying) startTimer();
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = 'cat-btn bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg transition shrink-0';
            });
            const selectedBtn = document.getElementById(`cat-${cat}`);
            if (selectedBtn) {
                selectedBtn.className = 'cat-btn bg-indigo-600 text-white px-3 py-1.5 rounded-lg shadow-sm transition shrink-0';
            }

            activeSlides = buildSlidesData(currentCategory, currentMode);
            currentSlideIndex = 0;

            renderSlides();
            showSlide(0);
            if (isPlaying) startTimer();
        }

        function toggleGridModal() {
            if (gridModal.classList.contains('hidden')) {
                renderGridItems();
                gridModal.classList.remove('hidden');
                gridModal.classList.add('flex');
            } else {
                gridModal.classList.add('hidden');
                gridModal.classList.remove('flex');
            }
        }

        // Keyboard navigation
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'PageDown') {
                nextSlide();
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                prevSlide();
            } else if (e.key === ' ') {
                e.preventDefault();
                togglePlayPause();
            }
        });

        // Initialize App
        window.addEventListener('load', () => {
            activeSlides = buildSlidesData('all', 'hiraToRoma');
            renderSlides();
            showSlide(0);
            startTimer();
        });
    </script>
</body>
</html>
